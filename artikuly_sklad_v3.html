<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">

<title>Учёт артикулов склада — V3</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
:root{
  --paper:#f5f4ef;--paper-raised:#fbfaf6;--white:#fff;--ink:#1e2320;--ink-soft:#5a6058;
  --line:#c9c5b8;--line-soft:#dedbd0;--rust:#c4501e;--rust-dark:#9e3d15;
  --green:#3c6e47;--green-soft:#eaf0e9;--error:#a83232;--error-bg:#f3e2de;
  --blue:#365f86;--blue-soft:#e8eef5;--amber:#9a6a19;--amber-soft:#f7efd9;
  --mono:"SF Mono","Cascadia Code",Consolas,"IBM Plex Mono",monospace;
  --display:"Bahnschrift","SF Compact Rounded","Arial Narrow",Arial,sans-serif;
  --body:-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box} html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit} button{cursor:pointer}
#app{max-width:1500px;margin:0 auto;padding:18px 22px 60px}
.header{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;border-bottom:3px solid var(--ink);padding-bottom:14px}
h1{font:700 26px var(--display);letter-spacing:.5px;text-transform:uppercase;margin:0 0 4px}
.subtitle{color:var(--ink-soft);font-size:13px}.header-actions,.toolbar,.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
button{border:1px solid var(--line);background:var(--paper-raised);color:var(--ink);padding:8px 13px;border-radius:4px}
button:hover{border-color:var(--ink-soft)} button.primary{background:var(--rust);border-color:var(--rust);color:#fff;font-weight:700}
button.primary:hover{background:var(--rust-dark)} button.success{background:var(--green);border-color:var(--green);color:#fff}
button.danger{background:var(--error);border-color:var(--error);color:#fff} button.ghost{border-color:transparent;background:transparent}
button.danger-text{color:var(--error);border-color:transparent;background:transparent} button.small{padding:5px 8px;font-size:12px}
button:disabled{opacity:.45;cursor:default}
.nav{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0}
.nav button.active{background:var(--ink);border-color:var(--ink);color:#fff}
.toolbar{margin:12px 0}.search{flex:1;min-width:230px}.search input,.field input,.field select,.field textarea,.toolbar select{
 width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:4px;background:#fff;color:var(--ink)
}.search input:focus,.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--rust)}
.toolbar select{width:auto}.count{color:var(--ink-soft);font-size:12px;white-space:nowrap}.spacer{flex:1}
.cards{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px;margin:16px 0}
.card{background:var(--paper-raised);border:1px solid var(--line);border-radius:5px;padding:12px}.card .num{font:700 24px var(--mono)}.card .lbl{color:var(--ink-soft);font-size:12px;margin-top:3px}
.card.warn{border-color:#d7b7af;background:var(--error-bg)}.card.good{border-color:#bfd0bd;background:var(--green-soft)}
.panel{background:var(--paper-raised);border:1px solid var(--line);border-radius:5px;margin-top:14px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;border-bottom:1px solid var(--line-soft);flex-wrap:wrap}
.panel-head h2,.panel-head h3{margin:0;font:700 16px var(--display);text-transform:uppercase}.panel-body{padding:14px}
.table-wrap{overflow:auto;max-height:67vh}.table{width:100%;border-collapse:collapse}.table th{text-align:left;background:var(--paper);position:sticky;top:0;z-index:3;border-bottom:2px solid var(--ink);padding:9px 10px;font-size:11px;color:var(--ink-soft);white-space:nowrap}
.table td{padding:8px 10px;border-bottom:1px solid var(--line-soft);vertical-align:top}.table tr:hover{background:#fffdf8}.table tr.low{background:#fff0ee}
.code{font-family:var(--mono);font-weight:700;white-space:nowrap}.code.click{cursor:pointer}.code.click:hover{color:var(--rust)}
.name{font-weight:700}.muted{color:var(--ink-soft);font-size:12px}.tag{display:inline-block;padding:2px 6px;border:1px solid var(--line-soft);background:#fff;border-radius:3px;font-size:11px;margin:2px 3px 0 0}
.status{display:inline-block;border-radius:3px;padding:2px 7px;font-size:11px;border:1px solid var(--line-soft);background:#fff}.status.active{background:var(--green-soft);border-color:#c7d8c5;color:var(--green)}.status.archive{background:#eee;border-color:#d3d0c6}.status.blocked{background:var(--error-bg);border-color:#e0bdb5;color:var(--error)}
.qty{font-family:var(--mono);font-weight:700}.qty.low{color:var(--error)}.mini-stepper{display:inline-flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}.mini-stepper button{border:0;border-radius:0;padding:4px 8px}.mini-stepper span{padding:4px 9px;min-width:34px;text-align:center}
.cat{white-space:nowrap}.cat-dot{display:inline-block;width:7px;height:7px;border-radius:1px;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.field{margin-bottom:12px}.field label{display:block;color:var(--ink-soft);font-size:12px;font-weight:700;margin-bottom:5px}.field textarea{min-height:75px;resize:vertical}
.section-title{font:700 13px var(--display);text-transform:uppercase;border-bottom:1px solid var(--line-soft);padding-bottom:5px;margin:16px 0 10px}
.empty{text-align:center;padding:42px;color:var(--ink-soft)} .empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}
.overlay{position:fixed;inset:0;background:rgba(30,35,32,.52);display:flex;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;z-index:100}
.modal{width:100%;max-width:900px;background:var(--paper-raised);border:1px solid var(--line);border-radius:6px;box-shadow:0 16px 40px rgba(0,0,0,.2);margin:auto}
.modal-head,.modal-foot{padding:13px 18px;display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid var(--line-soft)}.modal-foot{border-top:1px solid var(--line-soft);border-bottom:0;justify-content:flex-end;flex-wrap:wrap}.modal-head h2{margin:0;font:700 18px var(--display);text-transform:uppercase}.modal-body{padding:18px;max-height:70vh;overflow:auto}
.detail-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.detail-box{border:1px solid var(--line-soft);padding:10px;border-radius:4px;background:#fff}.detail-box .k{font-size:11px;color:var(--ink-soft)}.detail-box .v{font-weight:700;margin-top:3px}
.tabs{display:flex;gap:5px;flex-wrap:wrap;margin:12px 0}.tabs button.active{background:var(--ink);color:#fff;border-color:var(--ink)}
.kpi-row{display:flex;gap:10px;flex-wrap:wrap}.kpi{padding:9px 12px;background:#fff;border:1px solid var(--line-soft);border-radius:4px}.kpi b{font-family:var(--mono)}
.notice{padding:10px 12px;border:1px solid var(--line-soft);border-radius:4px;background:#fff;margin-bottom:10px}.notice.warn{background:var(--amber-soft);border-color:#e3d3ad}.notice.error{background:var(--error-bg);border-color:#e0bdb5}
.toast-stack{position:fixed;right:18px;bottom:18px;z-index:300;display:flex;flex-direction:column;gap:7px;max-width:390px}.toast{background:var(--ink);color:#fff;border-radius:4px;padding:10px 13px;box-shadow:0 8px 20px #0003}.toast.success{background:var(--green)}.toast.error{background:var(--error)}
.legend{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}.legend button{font-size:11px;padding:5px 8px}.legend button.active{background:#fff;border-color:var(--ink)}
.bom-row,.movement-row,.conflict-row{border-bottom:1px solid var(--line-soft);padding:8px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}.bom-row:last-child,.movement-row:last-child,.conflict-row:last-child{border-bottom:0}
.qr-box{background:#fff;border:1px solid var(--line);padding:15px;display:inline-block;text-align:center}.qr-wrap{text-align:center}
pre.schema{white-space:pre-wrap;background:#fff;border:1px solid var(--line-soft);padding:12px;border-radius:4px;font-family:var(--mono);font-size:12px}
@media(max-width:1000px){.cards{grid-template-columns:repeat(3,1fr)}.detail-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){#app{padding:12px}.cards{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}.detail-grid{grid-template-columns:1fr}h1{font-size:20px}.modal-body{padding:13px}}
</style>
</head>
<body><div id="app"></div>
<script>
/* =========================
   INVENTORY V3
   ========================= */
const CATEGORIES=[
 {code:'ELC',name:'Электронные компоненты',desc:'микросхемы, резисторы, конденсаторы',color:'#6B7A8F'},
 {code:'PCB',name:'Платы печатные',desc:'',color:'#4B7355'},
 {code:'ELM',name:'Электронные модули',desc:'',color:'#C4501E'},
 {code:'MEC',name:'Механические компоненты',desc:'винты, пружины, корпуса',color:'#7C6F57'},
 {code:'FLW',name:'Гидравлика и пневматика',desc:'шланги, фитинги, клапаны',color:'#3D6E82'},
 {code:'MIX',name:'Мех. + электронный модуль',desc:'',color:'#8C5383'},
 {code:'CAB',name:'Кабели и разъёмы',desc:'',color:'#B08830'},
 {code:'SWC',name:'ПО и прошивки',desc:'',color:'#4A5B8C'},
 {code:'PWR',name:'Питание',desc:'батареи, блоки питания',color:'#A83232'},
 {code:'PAC',name:'Упаковка и маркировка',desc:'блистеры, коробки, этикетки',color:'#6E8C3D'},
 {code:'BIO',name:'Биокомпоненты',desc:'реагенты, анестетики',color:'#2F8C7A'},
 {code:'ETC',name:'Прочее',desc:'без категории',color:'#8A8A82'}
];
const CAT_MAP=Object.fromEntries(CATEGORIES.map(c=>[c.code,c]));
const CODE_RE=/^([A-Z]{3})(\\d{5})([A-Z]+)$/;
const KEYS={
 articles:'articles-data-v3',history:'article-history-v3',settings:'inventory-settings-v3',
 movements:'stock-movements-v3',backups:'backup-list-v3',counter:'article-counter-v3'
};
const LEGACY='articles-data-v2';
const SEED_USAGE='Аппарат ИВЛ R10 Comen (Ива И10)';
const SEED_RAW=[
 ['MIX00001A','Шасси',1],['MIX00002A','Преобразователь АС-DC',1],['MEC00001A','Клемма эквипотенциального заземления',1],
 ['MIX00003A','Кулер в сборе',1],['FLW00001A','Разъем подачи O2 низкого давления',1],['CAB00001A','Разъем питания от сети переменного тока',1],
 ['CAB00002A','Разъем питания от сети постоянного тока',1],['PWR00001A','Аккумуляторная батарея',2],['MIX00004A','Датчик кислорода',1],
 ['ETC00001A','Заглушка датчика кислорода',1],['MEC00002A','Фиксатор кабеля питания',1],['MIX00005A','Клапан выдоха',1],
 ['ETC00002A','Комплект заглушек для винтов',1],['MEC00003A','Крышка защитная',1],['MEC00004A','Крышка задняя защитная',1],
 ['MIX00006A','Крышка лицевая с дисплеем',1],['ELM00001A','Модуль соединительный',1],['ELM00002A','Модуль датчиков',1],
 ['ELM00003A','Модуль управления',1],['ELM00004A','Модуль силовой',1],['MEC00005A','Ручка для переноски',1],
 ['MEC00006A','Стенка боковая левая',1],['MIX00007A','Стенка боковая правая',1],['MEC00007A','Стенка задняя',1],
 ['MEC00008A','Фильтр О2',1],['MEC00009A','Фильтр HEPA',1],['MEC00010A','Фильтр воздухозаборника охлаждения с крышкой',1],
 ['MEC00011A','Шина с втулкой',1],['MEC00012A','Шпилька с креплением (комплект 4 шт.)',1],['MEC00013A','Штуцер подачи O2 высокого давления',1],
 ['CAB00003A','Кабель питания',1]
];

let state={
 articles:[],movements:[],history:{},backups:[],settings:{},counter:{},loading:true,
 page:'dashboard',search:'',catFilter:'',stockFilter:'',statusFilter:'',selected:[],modal:null,modalData:null,toasts:[],
 importConflicts:[],importNew:[],myName:''
};
let form={}, bomForm={parentCode:'',childCode:'',childQty:1};

const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const now=()=>new Date().toISOString();
const pad=n=>String(n).padStart(5,'0');
const idxLetters=s=>{let n=0;for(const c of s)n=n*26+(c.charCodeAt(0)-64);return n-1};
const letters=idx=>{idx++;let s='';while(idx>0){let r=(idx-1)%26;s=String.fromCharCode(65+r)+s;idx=Math.floor((idx-1)/26)}return s};
const code=(cat,num,rev)=>cat+pad(num)+rev;
const getMin=a=>Number(a.minStock??0);
const isLow=a=>getMin(a)>0 && Number(a.qty||0)<getMin(a);
const catName=c=>CAT_MAP[c]?.name||c;

function normalizeArticle(a){
 const m=String(a.code||'').toUpperCase().match(CODE_RE);
 const category=m?m[1]:(a.category||'ETC'), number=m?Number(m[2]):Number(a.number||0), revision=m?m[3]:(a.revision||'A');
 return {
  id:a.id||uid(),code:code(category,number,revision),category,number,revision,
  name:a.name||'',desc:a.desc||'',qty:Number(a.qty||0),unit:a.unit||'шт',
  usage:a.usage||'',manufacturer:a.manufacturer||'',mpn:a.mpn||'',model:a.model||'',
  package:a.package||'',status:a.status||'active',date:a.date||today(),addedBy:a.addedBy||'—',
  minStock:Number(a.minStock||0),warehouse:a.warehouse||'Склад №1',location:a.location||'',
  docs:Array.isArray(a.docs)?a.docs:[],bom:Array.isArray(a.bom)?a.bom.map(x=>({code:x.code,qty:Number(x.qty||1),unit:x.unit||'шт',position:x.position||'',note:x.note||'',required:x.required!==false})):[],
  aliases:Array.isArray(a.aliases)?a.aliases:[],notes:a.notes||''
 };
}
function seed(){
 return SEED_RAW.map(([c,n,q])=>normalizeArticle({code:c,name:n,qty:q,usage:SEED_USAGE,addedBy:'импорт: Только НДА, ИВЛ, МП',date:'2026-09-01',minStock:1,warehouse:'Склад №1'}));
}

/* storage adapter: supports the original host storage API and ordinary browsers */
async function storeGet(key,shared=true){
 try{
  if(window.storage?.get){let r=await window.storage.get(key,shared);return r?.value??null}
 }catch(e){}
 return localStorage.getItem(key);
}
async function storeSet(key,value,shared=true){
 try{
  if(window.storage?.set){await window.storage.set(key,value,shared);return}
 }catch(e){}
 localStorage.setItem(key,value);
}
async function load(){
 state.loading=true;render();
 let raw=await storeGet(KEYS.articles,true);
 if(!raw) raw=await storeGet(LEGACY,true);
 if(raw){try{state.articles=JSON.parse(raw).map(normalizeArticle)}catch(e){state.articles=[]}}
 if(!state.articles.length) state.articles=seed();
 for(const [k,target] of [['history','history'],['movements','movements'],['backups','backups'],['settings','settings'],['counter','counter']]){
  const raw2=await storeGet(KEYS[k],true); if(raw2) try{state[target]=JSON.parse(raw2)}catch(e){}
 }
 state.myName=state.settings.myName||'';
 rebuildCounters(false);
 state.loading=false;render();
 if(!state.myName) openWho();
}
async function saveAll(){
 await storeSet(KEYS.articles,JSON.stringify(state.articles),true);
 await storeSet(KEYS.history,JSON.stringify(state.history),true);
 await storeSet(KEYS.movements,JSON.stringify(state.movements),true);
 await storeSet(KEYS.settings,JSON.stringify({...state.settings,myName:state.myName}),true);
 await storeSet(KEYS.counter,JSON.stringify(state.counter),true);
}
function toast(kind,title,body=''){
 const t={id:uid(),kind,title,body};state.toasts.push(t);render();
 setTimeout(()=>{state.toasts=state.toasts.filter(x=>x.id!==t.id);render()},4200);
}
function history(code0,action,details,user=state.myName||'—'){
 if(!state.history[code0])state.history[code0]=[];
 state.history[code0].push({date:now(),action,details,user});
}
function movement(code0,type,delta,before,after,reason=''){
 state.movements.push({id:uid(),date:now(),code:code0,type,delta,before,after,reason,user:state.myName||'—'});
 history(code0,type,`${delta>0?'+':''}${delta} ${reason?'· '+reason:''}`);
}
function rebuildCounters(save=true){
 for(const c of CATEGORIES) state.counter[c.code]=Math.max(Number(state.counter[c.code]||0),...state.articles.filter(a=>a.category===c.code).map(a=>a.number),0);
 if(save)storeSet(KEYS.counter,JSON.stringify(state.counter),true);
}
function nextNumber(cat){state.counter[cat]=Number(state.counter[cat]||0)+1;return state.counter[cat]}
function nextRevision(cat,num){
 const rs=state.articles.filter(a=>a.category===cat&&a.number===num).map(a=>idxLetters(a.revision));
 return rs.length?letters(Math.max(...rs)+1):'A';
}
function baseArticles(){
 const m=new Map();
 for(const a of state.articles){const k=a.category+pad(a.number);if(!m.has(k)||idxLetters(a.revision)>idxLetters(m.get(k).revision))m.set(k,a)}
 return [...m.values()].sort((a,b)=>a.code.localeCompare(b.code));
}
function revisions(a){return state.articles.filter(x=>x.category===a.category&&x.number===a.number).sort((x,y)=>idxLetters(x.revision)-idxLetters(y.revision))}
function getArticle(c){return state.articles.find(a=>a.code===c)}
function parentsOf(c){return state.articles.filter(a=>(a.bom||[]).some(b=>b.code===c))}
function findBomPath(from,target,visited=new Set()){
 if(from===target)return true;if(visited.has(from))return false;visited.add(from);
 const a=getArticle(from);return !!a?.bom?.some(b=>findBomPath(b.code,target,visited));
}
function flattenBom(c,qty=1,stack=[]){
 if(stack.includes(c))return {items:[],cycle:true};
 const a=getArticle(c);if(!a||!a.bom?.length)return {items:[{code:c,qty}],cycle:false};
 let items=[],cycle=false;
 for(const b of a.bom){const r=flattenBom(b.code,qty*Number(b.qty||1),[...stack,c]);items.push(...r.items);cycle ||= r.cycle}
 const m=new Map();for(const x of items)m.set(x.code,(m.get(x.code)||0)+x.qty);
 return {items:[...m].map(([x,q])=>({code:x,qty:q})),cycle};
}
function filtered(){
 let l=state.articles;
 if(state.catFilter)l=l.filter(a=>a.category===state.catFilter);
 if(state.statusFilter)l=l.filter(a=>a.status===state.statusFilter);
 if(state.stockFilter==='low')l=l.filter(isLow);
 if(state.stockFilter==='zero')l=l.filter(a=>(a.qty||0)===0);
 if(state.stockFilter==='available')l=l.filter(a=>(a.qty||0)>0);
 const q=state.search.trim().toLowerCase();
 if(q)l=l.filter(a=>[a.code,a.name,a.desc,a.usage,a.manufacturer,a.mpn,a.model,a.location,a.warehouse,...a.aliases].join(' ').toLowerCase().includes(q));
 return [...l].sort((a,b)=>a.code.localeCompare(b.code));
}
function stockTotal(){return state.articles.reduce((s,a)=>s+Number(a.qty||0),0)}
function createBackup(){
 const b={id:uid(),date:now(),count:state.articles.length,data:JSON.stringify(state.articles),movements:JSON.stringify(state.movements),history:JSON.stringify(state.history)};
 state.backups.unshift(b);state.backups=state.backups.slice(0,20);storeSet(KEYS.backups,JSON.stringify(state.backups),true);
 toast('success','Резервная копия создана',`${b.count} артикулов`);
}
async function restoreBackup(id){
 const b=state.backups.find(x=>x.id===id);if(!b)return;
 if(!confirm(`Восстановить бэкап от ${new Date(b.date).toLocaleString()}? Текущие данные будут заменены.`))return;
 try{state.articles=JSON.parse(b.data).map(normalizeArticle);state.movements=b.movements?JSON.parse(b.movements):[];state.history=b.history?JSON.parse(b.history):{};rebuildCounters(false);await saveAll();state.modal=null;toast('success','Бэкап восстановлен',`${state.articles.length} артикулов`);render()}catch(e){toast('error','Ошибка восстановления',e.message)}
}

/* ---------- pages ---------- */
function render(){
 const app=$('#app');
 app.innerHTML=`
 <div class="header">
  <div><h1>📦 Учёт артикулов склада · V3</h1><div class="subtitle">Номенклатура · ревизии · BOM · склад · движения · аудит · Excel · QR</div></div>
  <div class="header-actions">
   <button id="who">👤 ${esc(state.myName||'указать имя')}</button>
   <button id="backup">💾 Бэкап</button><button id="restore">📂 Восстановить</button>
   <button id="import">📥 Excel</button><button id="export">📤 Excel</button>
   <button class="primary" id="add">+ Артикул</button>
  </div>
 </div>
 <div class="nav">

function checksPage(){
 const errors=[],cycles=[],orphan=[];
 for(const a of state.articles){
  if(!CAT_MAP[a.category])errors.push(`${a.code}: неизвестная категория`);
  if(!/^[A-Z]+$/.test(a.revision))errors.push(`${a.code}: неверная ревизия`);
  for(const b of a.bom||[]){
   if(!getArticle(b.code))orphan.push(`${a.code} → ${b.code}`);
   if(findBomPath(b.code,a.code))cycles.push(`${a.code} → ${b.code}`);
  }

 <button class="primary" id="addBom">➕ Добавить компонент</button>
 <div class="section-title">Состав</div>${(a.bom||[]).map(b=>{let c=getArticle(b.code);return `<div class="bom-row"><span class="code">${esc(b.code)}</span><span>${c?esc(c.name):'❌ удалён'}</span><span class="qty">×${b.qty}</span><span class="muted">${esc(b.position||'')}</span><span class="spacer"></span><button class="danger-text small" data-bom-remove="${esc(a.code)}|${esc(b.code)}">✕</button></div>`}).join('')||'<div class="empty">Компоненты не добавлены.</div>'}
 <div class="section-title">Расход на 1 изделие</div>${(()=>{const r=flattenBom(a.code,1);return r.cycle?'<div class="notice error">Обнаружен цикл BOM.</div>':r.items.filter(x=>x.code!==a.code).map(x=>`<div class="bom-row"><span class="code">${esc(x.code)}</span><span>${esc(getArticle(x.code)?.name||'')}</span><span class="qty">×${x.qty}</span></div>`).join('')||'<div class="muted">Нет данных.</div>'})()}
 <div class="section-title">Где используется</div>${parentsOf(a.code).map(p=>`<div class="bom-row"><span class="code">${esc(p.code)}</span><span>${esc(p.name)}</span><span class="qty">×${p.bom.find(x=>x.code===a.code)?.qty||1}</span></div>`).join('')||'<div class="muted">Нигде не используется.</div>'}
 </div><div class="modal-foot"><button id="close">Закрыть</button></div></div></div>`;
}
function qrModal(){
 const c=state.modalData;return `<div class="overlay" id="overlay"><div class="modal" style="max-width:430px"><div class="modal-head"><h2>QR · ${esc(c)}</h2><button class="ghost" id="close">✕</button></div><div class="modal-body qr-wrap"><div id="qr" class="qr-box"></div><div class="code" style="margin-top:10px">${esc(c)}</div><p class="muted">QR содержит код артикула.</p><button id="printQR">🖨️ Печать</button></div><div class="modal-foot"><button id="close">Закрыть</button></div></div></div>`}
function restoreModal(){return `<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h2>Бэкапы</h2><button class="ghost" id="close">✕</button></div><div class="modal-body">${state.backups.map(b=>`<div class="bom-row"><span>${new Date(b.date).toLocaleString()}</span><span>${b.count} артикулов</span><span class="spacer"></span><button class="primary" data-restore="${b.id}">Восстановить</button></div>`).join('')||'<div class="empty">Бэкапов нет.</div>'}</div><div class="modal-foot"><button id="close">Закрыть</button></div></div></div>`}
function importModal(){return `<div class="overlay" id="overlay"><div class="modal"><div class="modal-head"><h2>Конфликты Excel</h2><button class="ghost" id="close">✕</button></div><div class="modal-body"><div class="notice">Новых строк: <b>${state.importNew.length}</b> · конфликтов: <b>${state.importConflicts.length}</b></div>
 <div class="inline"><button class="success" id="importAddNew">Добавить только новые</button><button class="danger" id="importOverwrite">Перезаписать конфликты</button></div>
 <div class="section-title">Конфликты</div>${state.importConflicts.map(x=>`<div class="conflict-row"><span class="code">${esc(x.item.code)}</span><span>Было: ${esc(x.existing.name)} (${x.existing.qty||0})</span><span>Новое: ${esc(x.item.name)} (${x.item.qty||0})</span></div>`).join('')}</div><div class="modal-foot"><button id="close">Отмена</button></div></div></div>`}

/* ---------- actions ---------- */
function openWho(){state.modal='who';render()}
function openArticle(c=null){
 if(c){state.modalData=c;form={};state.modal='article';render();return}
 form={mode:'new',category:'ELC',base:'',name:'',usage:'',manufacturer:'',mpn:'',model:'',unit:'шт',qty:0,minStock:0,warehouse:'Склад №1',location:'',status:'active',desc:'',aliases:[]};
 state.modalData=null;state.modal='article';render();
}
function openMovement(c){state.modal='movement';state.modalData=c||'';render()}
function saveArticle(){
 const existing=state.modalData?getArticle(state.modalData):null;
 const name=$('#f-name').value.trim();if(!name){toast('error','Укажите наименование');return}
 if(existing){
  const old=JSON.stringify(existing);
  Object.assign(existing,{name,usage:$('#f-usage').value.trim(),manufacturer:$('#f-manufacturer').value.trim(),mpn:$('#f-mpn').value.trim(),model:$('#f-model').value.trim(),unit:$('#f-unit').value.trim()||'шт',qty:Math.max(0,Number($('#f-qty').value)||0),minStock:Math.max(0,Number($('#f-min').value)||0),warehouse:$('#f-warehouse').value.trim(),location:$('#f-location').value.trim(),status:$('#f-status').value,desc:$('#f-desc').value.trim(),aliases:$('#f-aliases').value.split(',').map(x=>x.trim()).filter(Boolean)});
  if(JSON.stringify(existing)!==old)history(existing.code,'изменение','Карточка артикула изменена');
  state.modal=null;saveAll();render();toast('success','Сохранено',existing.code);return;
 }
 const cat=$('#f-cat').value,mode=$('#f-mode').value;
 let cat2=cat,num,rev;
 if(mode==='new'){num=nextNumber(cat2);rev='A'}else{const [bc,bn]=($('#f-base')?.value||'').split(':');cat2=bc;num=Number(bn);rev=nextRevision(cat2,num)}
 const c=code(cat2,num,rev);
 if(getArticle(c)){toast('error','Код уже существует',c);return}
 const a=normalizeArticle({code:c,name,category:cat2,number:num,revision:rev,usage:$('#f-usage').value.trim(),manufacturer:$('#f-manufacturer').value.trim(),mpn:$('#f-mpn').value.trim(),model:$('#f-model').value.trim(),unit:$('#f-unit').value.trim()||'шт',qty:Math.max(0,Number($('#f-qty').value)||0),minStock:Math.max(0,Number($('#f-min').value)||0),warehouse:$('#f-warehouse').value.trim(),location:$('#f-location').value.trim(),status:$('#f-status').value,desc:$('#f-desc').value.trim(),aliases:$('#f-aliases').value.split(',').map(x=>x.trim()).filter(Boolean),addedBy:state.myName||'—',date:today()});
 state.articles.push(a);state.counter[cat2]=Math.max(Number(state.counter[cat2]||0),num);history(c,'создание',`Создан артикул ${c}`);if(a.qty)movement(c,'Начальный остаток',a.qty,0,a.qty,'При создании');state.modal=null;saveAll();render();toast('success','Артикул создан',c);
}
function doMovement(){
 const a=getArticle($('#m-code').value),type=$('#m-type').value,n=Math.max(0,Number($('#m-qty').value)||0),reason=$('#m-reason').value.trim();if(!a||n<=0){toast('error','Укажите артикул и положительное количество');return}
 let delta=n;if(type==='Списание')delta=-n;if(type==='Корректировка')delta=n-(a.qty||0);if(type==='Инвентаризация')delta=n-(a.qty||0);
 if(type==='Перемещение'){toast('success','Перемещение отмечено','Для нескольких складов используйте поле склада в карточке.');}
 const before=Number(a.qty||0),after=before+delta;if(after<0){toast('error','Недостаточно на складе',`${a.code}: ${before} ${a.unit}`);return}
 a.qty=after;movement(a.code,type,delta,before,after,reason);state.modal=null;saveAll();render();toast('success','Движение проведено',`${a.code}: ${before} → ${after}`);
}
function addBom(){
 const a=getArticle(bomForm.parentCode),child=$('#b-child').value,n=Number($('#b-qty').value)||0,pos=$('#b-pos').value.trim();if(!a||!child||n<=0)return;
 if(a.bom.some(x=>x.code===child)){toast('error','Компонент уже есть');return}
 if(findBomPath(child,a.code)){toast('error','Циклическая ссылка','Добавление создаст цикл BOM.');return}
 a.bom.push({code:child,qty:n,unit:getArticle(child)?.unit||'шт',position:pos,note:'',required:true});history(a.code,'изменение BOM',`Добавлен ${child} ×${n}`);saveAll();render();state.modal='bom';render();
}
function removeBom(parent,child){
 const a=getArticle(parent);if(!a)return;a.bom=a.bom.filter(x=>x.code!==child);history(parent,'изменение BOM',`Удалён ${child}`);saveAll();state.modal='bom';render();toast('success','Компонент удалён',child)
}
function batch(delta){
 const n=Number(prompt(delta>0?'Приход для выбранных:':'Списание для выбранных:','1'));if(!n||n<=0)return;
 let bad=[];for(const c of state.selected){const a=getArticle(c);if(!a)continue;const before=a.qty||0,after=before+delta*n;if(after<0){bad.push(c);continue}a.qty=after;movement(c,delta>0?'Приход':'Списание',delta*n,before,after,'Массовая операция')}
 state.selected=[];saveAll();render();if(bad.length)toast('error','Не хватило остатка',bad.join(', '));else toast('success','Массовая операция выполнена',`${n} на ${state.selected.length||'выбранных'} поз.`);
}
function toggleSel(c){const i=state.selected.indexOf(c);if(i>=0)state.selected.splice(i,1);else state.selected.push(c);render()}

/* ---------- import/export ---------- */
function importFile(file){
 const r=new FileReader();r.onload=e=>{try{
  const wb=XLSX.read(e.target.result,{type:'array'}),sh=wb.Sheets[wb.SheetNames[0]],rows=XLSX.utils.sheet_to_json(sh,{defval:''}),newItems=[],conflicts=[];
  const col=(row,pats)=>{const k=Object.keys(row).find(k=>pats.some(p=>k.toLowerCase().includes(p)));return k};
  let invalid=0;
  for(const row of rows){
   const kc=col(row,['артикул','код','code']);const raw=String(kc?row[kc]:'').trim().toUpperCase(),m=raw.match(CODE_RE);if(!m||!CAT_MAP[m[1]]){invalid++;continue}
   const get=p=>{const k=col(row,p);return k?row[k]:''};
   const item=normalizeArticle({code:raw,name:String(get(['наимен','назван','name'])||raw).trim(),desc:String(get(['описан','коммент','desc'])||'').trim(),qty:Number(get(['кол-во','количество','qty'])||0),usage:String(get(['примен','usage'])||'').trim(),manufacturer:String(get(['производ','manufacturer'])||'').trim(),mpn:String(get(['mpn','part number','part'])||'').trim(),unit:String(get(['ед','unit'])||'шт').trim()||'шт',warehouse:String(get(['склад','warehouse'])||'Склад №1').trim()||'Склад №1',location:String(get(['ячей','место','location'])||'').trim(),minStock:Number(get(['мин','minimum'])||0),addedBy:state.myName||'импорт',date:today()});
   const ex=getArticle(raw);if(ex)conflicts.push({item,existing:ex});else newItems.push(item);
  }
  state.importNew=newItems;state.importConflicts=conflicts;state.modal='import';render();
  if(invalid)toast('error','В импорте есть некорректные строки',`Пропущено: ${invalid}`);
 }catch(err){toast('error','Ошибка Excel',err.message)}};r.readAsArrayBuffer(file)
}
function finishImport(overwrite){
 for(const x of state.importNew)state.articles.push(x);
 if(overwrite)for(const x of state.importConflicts){Object.assign(x.existing,x.item,{id:x.existing.id,addedBy:x.existing.addedBy,date:x.existing.date})}
 const n=state.importNew.length+(overwrite?state.importConflicts.length:0);state.importNew=[];state.importConflicts=[];state.modal=null;rebuildCounters(false);saveAll();render();toast('success','Импорт завершён',`${n} строк обработано`)
}
function exportExcel(){
 const rows=state.articles.slice().sort((a,b)=>a.code.localeCompare(b.code)).map(a=>({'Артикул':a.code,'Категория':a.category+' — '+catName(a.category),'Наименование':a.name,'Описание':a.desc,'Количество':a.qty||0,'Ед. изм.':a.unit,'Минимальный остаток':a.minStock||0,'Применяемость':a.usage,'Производитель':a.manufacturer,'MPN':a.mpn,'Модель/тип':a.model,'Склад':a.warehouse,'Ячейка':a.location,'Статус':a.status,'Ревизия':a.revision,'Дата добавления':a.date,'Добавил':a.addedBy,'Аналоги':a.aliases.join(', '),'BOM':(a.bom||[]).map(b=>b.code+'×'+b.qty).join('; ')}));
 const wb=XLSX.utils.book_new(),ws=XLSX.utils.json_to_sheet(rows);ws['!cols']=[{wch:13},{wch:32},{wch:35},{wch:35},{wch:11},{wch:10},{wch:16},{wch:32},{wch:24},{wch:22},{wch:20},{wch:16},{wch:18},{wch:14},{wch:12},{wch:14},{wch:20},{wch:30},{wch:45}];XLSX.utils.book_append_sheet(wb,ws,'Артикулы');
 const mov=state.movements.map(m=>({'Дата':m.date,'Артикул':m.code,'Операция':m.type,'Изменение':m.delta,'До':m.before,'После':m.after,'Основание':m.reason,'Пользователь':m.user}));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(mov),'Движение');
 const bom=[];state.articles.forEach(a=>(a.bom||[]).forEach(b=>bom.push({'Изделие':a.code,'Наименование изделия':a.name,'Компонент':b.code,'Наименование компонента':getArticle(b.code)?.name||'','Количество':b.qty,'Ед. изм.':b.unit,'Позиция':b.position,'Примечание':b.note})));XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(bom),'BOM');
 XLSX.writeFile(wb,'artikuly-sklad-v3-'+today()+'.xlsx');
}

/* ---------- bind ---------- */
function bind(){
 $$('[data-page]').forEach(x=>x.onclick=()=>{state.page=x.dataset.page;state.search='';render()});
 $('#add')?.addEventListener('click',()=>openArticle());
 $('#who')?.addEventListener('click',openWho);
 $('#backup')?.addEventListener('click',createBackup);
 $('#restore')?.addEventListener('click',()=>{state.modal='restore';render()});
 $('#import')?.addEventListener('click',()=>$('#file').click());
 $('#export')?.addEventListener('click',exportExcel);
 $('#file')?.addEventListener('change',e=>{if(e.target.files[0])importFile(e.target.files[0]);e.target.value=''});

 $('#search')?.addEventListener('input',e=>{state.search=e.target.value;render();setTimeout(()=>{const x=$('#search');if(x){x.focus();x.setSelectionRange(x.value.length,x.value.length)}},0)});
 $('#stockFilter')?.addEventListener('change',e=>{state.stockFilter=e.target.value;render()});
 $('#statusFilter')?.addEventListener('change',e=>{state.statusFilter=e.target.value;render()});
 $$('[data-cat]').forEach(x=>x.onclick=()=>{state.catFilter=state.catFilter===x.dataset.cat?'':x.dataset.cat;render()});
 $$('[data-stock-filter]').forEach(x=>x.onclick=()=>{state.page='articles';state.stockFilter=x.dataset.stockFilter;render()});
 $$('[data-open]').forEach(x=>x.onclick=()=>openArticle(x.dataset.open));
 $$('[data-qty]').forEach(x=>x.onclick=()=>{const a=getArticle(x.dataset.code),d=Number(x.dataset.qty);if(!a)return;if(d<0&&(a.qty||0)<=0){toast('error','Нельзя списать','Остаток уже 0');return}const b=a.qty||0;a.qty=b+d;movement(a.code,d>0?'Приход':'Списание',d,b,a.qty,'Быстрая операция');saveAll();render()});
 $$('.sel').forEach(x=>x.onchange=()=>toggleSel(x.dataset.code));
 $('#toggleAll')?.addEventListener('change',e=>{state.selected=e.target.checked?filtered().map(a=>a.code):[];render()});
 $('#selectAll')?.addEventListener('click',()=>{const l=filtered();state.selected=state.selected.length===l.length?[]:l.map(a=>a.code);render()});
 $('#batchAdd')?.addEventListener('click',()=>batch(1));$('#batchSub')?.addEventListener('click',()=>batch(-1));$('#batchMove')?.addEventListener('click',()=>openMovement());
 $('#movementNew')?.addEventListener('click',()=>openMovement());
 $$('[data-bom]').forEach(x=>x.onclick=()=>{bomForm={parentCode:x.dataset.bom,childCode:'',childQty:1};state.modal='bom';render()});
 $$('[data-qr]').forEach(x=>x.onclick=()=>{state.modal='qr';state.modalData=x.dataset.qr;render();setTimeout(()=>{const q=$('#qr');if(q&&window.QRCode)new QRCode(q,{text:state.modalData,width:200,height:200,colorDark:'#1e2320',colorLight:'#fff',correctLevel:QRCode.CorrectLevel.H})},50)});
 $$('[data-archive]').forEach(x=>x.onclick=()=>{const a=getArticle(x.dataset.archive);if(!a)return;a.status=a.status==='archive'?'active':'archive';history(a.code,'статус',a.status==='archive'?'Артикул архивирован':'Артикул возвращён в работу');saveAll();render()});
 $('#saveSettings')?.addEventListener('click',()=>{state.settings.warehouses=$('#warehouses').value.split('\\n').map(x=>x.trim()).filter(Boolean);saveAll();toast('success','Настройки сохранены')});

 if(state.modal){
  $('#close')?.addEventListener('click',()=>{state.modal=null;render()});
  $('#overlay')?.addEventListener('click',e=>{if(e.target.id==='overlay'){state.modal=null;render()}});
 }
 if(state.modal==='who')$('#saveName')?.addEventListener('click',async()=>{const v=$('#myName').value.trim();if(!v)return;state.myName=v;state.settings.myName=v;await saveAll();state.modal=null;render()});
 if(state.modal==='article'){
  $('#f-mode')?.addEventListener('change',e=>{form.mode=e.target.value;render()});
  $('#f-cat')?.addEventListener('change',e=>{form.category=e.target.value;render()});
  $('#f-base')?.addEventListener('change',e=>{form.base=e.target.value;render()});
  $('#saveArticle')?.addEventListener('click',saveArticle);
  $('#f-name')?.focus();
  $$('[data-bom]').forEach(x=>x.onclick=()=>{bomForm={parentCode:x.dataset.bom,childCode:'',childQty:1};state.modal='bom';render()});
  $$('[data-qr]').forEach(x=>x.onclick=()=>{state.modal='qr';state.modalData=x.dataset.qr;render();setTimeout(()=>new QRCode($('#qr'),{text:state.modalData,width:200,height:200}),50)});
 }
 if(state.modal==='movement')$('#saveMovement')?.addEventListener('click',doMovement);
 if(state.modal==='bom'){
  $('#b-child')?.addEventListener('change',e=>bomForm.childCode=e.target.value);$('#b-qty')?.addEventListener('input',e=>bomForm.childQty=e.target.value);$('#addBom')?.addEventListener('click',addBom);
  $$('[data-bom-remove]').forEach(x=>x.onclick=()=>{const [p,c]=x.dataset.bomRemove.split('|');removeBom(p,c)});
 }
 if(state.modal==='qr')$('#printQR')?.addEventListener('click',()=>window.print());
 if(state.modal==='restore')$$('[data-restore]').forEach(x=>x.onclick=()=>restoreBackup(x.dataset.restore));
 if(state.modal==='import'){ $('#importAddNew')?.addEventListener('click',()=>finishImport(false));$('#importOverwrite')?.addEventListener('click',()=>finishImport(true))}
}
load();
</script>
</body>
</html>
